[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-network-rca"
version = "1.0.0"
description = "Synthetic, topology-aware root-cause analysis for autonomous networks"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Abhi Gupta"}]
keywords = ["product-ai", "root-cause-analysis", "autonomous-networks", "aiops", "explainability"]

[project.scripts]
network-rca = "autonomous_network_rca.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
