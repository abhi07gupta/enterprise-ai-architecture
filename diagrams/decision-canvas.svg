<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">Enterprise AI architecture decision canvas</title><desc id="d">Six-step decision sequence from outcome through suitability, context, reasoning, trust and operations.</desc><rect width="1200" height="520" fill="#FAFAF8"/><style>text{font-family:Inter,Arial,sans-serif}.h{font-size:24px;font-weight:750;fill:#142638}.s{font-size:17px;fill:#64717D}.n{font-size:18px;font-weight:800;fill:#39767A}.b{fill:#fff;stroke:#D7DDDF;stroke-width:2}.last{fill:#E7F0EF;stroke:#39767A;stroke-width:2}.ln{stroke:#526D82;stroke-width:2;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526D82"/></marker></defs><text x="60" y="62" class="n">ARCHITECTURE DECISION SEQUENCE</text><text x="60" y="105" class="h">Move from business outcome to operating reality.</text><g transform="translate(42 170)"><g><rect class="b" x="0" y="0" width="165" height="220" rx="8"/><text class="n" x="20" y="34">01</text><text class="h" x="20" y="78">Outcome</text><text class="s" x="20" y="120">Clarify the decision</text><text class="s" x="20" y="148">and measurable value.</text></g><path class="ln" d="M169 110 L190 110"/><g transform="translate(194 0)"><rect class="b" x="0" y="0" width="165" height="220" rx="8"/><text class="n" x="20" y="34">02</text><text class="h" x="20" y="78">Suitability</text><text class="s" x="20" y="120">Test whether AI</text><text class="s" x="20" y="148">is the right intervention.</text></g><path class="ln" d="M363 110 L384 110"/><g transform="translate(388 0)"><rect class="b" x="0" y="0" width="165" height="220" rx="8"/><text class="n" x="20" y="34">03</text><text class="h" x="20" y="78">Context</text><text class="s" x="20" y="120">Define data, knowledge</text><text class="s" x="20" y="148">and semantic needs.</text></g><path class="ln" d="M557 110 L578 110"/><g transform="translate(582 0)"><rect class="b" x="0" y="0" width="165" height="220" rx="8"/><text class="n" x="20" y="34">04</text><text class="h" x="20" y="78">Reasoning</text><text class="s" x="20" y="120">Choose the simplest</text><text class="s" x="20" y="148">capable approach.</text></g><path class="ln" d="M751 110 L772 110"/><g transform="translate(776 0)"><rect class="b" x="0" y="0" width="165" height="220" rx="8"/><text class="n" x="20" y="34">05</text><text class="h" x="20" y="78">Trust</text><text class="s" x="20" y="120">Design validation,</text><text class="s" x="20" y="148">oversight and failure handling.</text></g><path class="ln" d="M945 110 L966 110"/><g transform="translate(970 0)"><rect class="last" x="0" y="0" width="165" height="220" rx="8"/><text class="n" x="20" y="34">06</text><text class="h" x="20" y="78">Operations</text><text class="s" x="20" y="120">Integrate ownership,</text><text class="s" x="20" y="148">observability and change.</text></g></g></svg>
